<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<style>
html,body{margin:0;height:100%;background:#050605;color:#e8f0e0;font-family:'VT323',monospace;overflow:hidden}
#screen,#dlg,#paper,#phone,#bag,#ui{-webkit-user-select:none;user-select:none} /* bấm liên tục không còn bôi xanh chữ */
input{-webkit-user-select:text;user-select:text}
canvas#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#screen{position:relative}
.sh{text-shadow:2px 2px 0 #000}
#dlg{background:#2a1c18;border:4px solid #120a07;border-radius:6px;box-shadow:inset 0 0 0 3px #b07a4a,inset 0 0 0 5px #3a2418,5px 5px 0 #000;color:#f2e2c4}
#dlgWho{position:absolute;left:14px;top:-26px;background:#2a1c18;border:4px solid #120a07;border-radius:5px;box-shadow:inset 0 0 0 2px #b07a4a;padding:2px 16px 0;color:#f2e2c4;font-size:28px;line-height:1.05}
#dlgWho:empty{display:none}
#pt{position:absolute;left:8px;bottom:calc(100% + 30px);width:clamp(84px,15vw,150px);aspect-ratio:108/114;background:#1d1512;border:4px solid #120a07;border-radius:6px;box-shadow:inset 0 0 0 3px #b07a4a,4px 4px 0 #000;overflow:hidden;padding:4px}
#pt img{width:100%;height:100%;display:block;border-radius:2px}
#dlgHint{position:absolute;right:16px;bottom:8px;color:#e8c88a;font-size:24px;animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#cap{transition:opacity .6s}
/* ---- điều khiển cảm ứng cho điện thoại ---- */
html,body{touch-action:manipulation}
body.touch{touch-action:none;overscroll-behavior:none;position:fixed;inset:0;-webkit-text-size-adjust:100%}
body.touch *{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.touch button,body.touch #ui,body.touch #pause,body.touch #bag,body.touch #paper{touch-action:manipulation}
/* màn hình chính và menu: canh giữa khi vừa, cuộn được khi màn hình thấp (xoay ngang) */
#ui,#pause{align-items:flex-start!important;justify-content:flex-start!important;padding:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
#ui>div,#pause>div{margin:auto!important}
body.touch #volbar{display:none}
#tc{position:fixed;inset:0;pointer-events:none;z-index:15}
#tc.hide{display:none}
#tc .tb{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;border-radius:50%;background:rgba(26,18,12,.55);border:2px solid rgba(232,193,90,.7);color:#f2e2c4;font-family:VT323,monospace;font-size:22px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
#tc .tb.on{background:rgba(232,193,90,.75);color:#2a1c18}
#tc .big{width:68px;height:68px;font-size:30px}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(26,18,12,.35);border:2px solid rgba(232,193,90,.45);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(232,193,90,.55);border:2px solid rgba(255,240,200,.8);pointer-events:none}
#tbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;align-items:flex-end;gap:8px;max-width:200px}
#tc .cmb,#tc .boss,#tc .surv,#tc .atk,#tc .map{display:none}
#tc.combat .cmb,#tc.combat .atk,#tc.boss .boss,#tc.surv .surv,#tc.hasmap .map{display:flex}
#dpad{display:none;position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));gap:10px} /* bên trái, không che vạch đích của mũi tên */
#tc.dance #dpad{display:flex}#tc.dance #joy,#tc.dance #tbtns{display:none}
#dpad .tb{width:62px;height:62px;font-size:30px;border-radius:12px}
#tsys{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 140px);display:flex;gap:6px}
#tc .sm{width:40px;height:40px;font-size:18px}
#prompt .pk{pointer-events:auto}
@media (max-height:520px),(max-width:720px){
  #dlgTxt{font-size:19px!important;min-height:2.2em!important}#dlgWho{font-size:17px;top:-22px;padding:1px 10px 0}#dlg{padding:12px 12px 8px!important}#dlgHint{font-size:16px}
  #pt{width:clamp(56px,13vw,96px)!important;bottom:calc(100% + 24px)}#prompt{font-size:17px;bottom:34%}#obj{font-size:14px}#obj .qm i{font-size:11px}#where{font-size:13px}
  #bag,#paper{font-size:17px!important}#paper{padding:22px 24px!important}.note{font-size:14px}.note b{width:16px;height:16px;line-height:16px;font-size:12px}
  #ui .text-6xl{font-size:34px}#ui img.w-20{width:52px;height:52px}#ui .mt-4{margin-top:10px}#ui .mt-3{margin-top:8px}#ui .text-5xl{font-size:32px}#ui .text-4xl{font-size:26px}#ui .text-3xl{font-size:21px}#ui .text-2xl{font-size:17px}#ui .text-xl{font-size:15px}#ui>div{margin:8px;padding:14px}
  #pause .pb{font-size:20px}#capBig{font-size:34px!important}#capSmall{font-size:20px!important}
}
#pause .pz{background:#2a1c18;border:4px solid #120a07;border-radius:8px;box-shadow:inset 0 0 0 3px #b07a4a,inset 0 0 0 5px #3a2418,6px 6px 0 #000;color:#f2e2c4;padding:22px 28px;min-width:min(360px,90vw);animation:uiIn .2s ease-out}
#pause .pb{display:block;width:100%;text-align:left;font-size:26px;padding:2px 14px;border:2px solid #b07a4a;background:#3a2418;color:#f2e2c4;border-radius:4px;transition:background-color .1s,transform .06s}#pause .pb:hover,#pause .pb.sel{background:#e8c15a;color:#2a1c18}#pause .pb:active{transform:translate(2px,2px)}
#pause input[type=range]{width:100%;accent-color:#e8c15a}
@keyframes crRoll{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 52vh))}}
#prompt .pk{display:inline-flex;align-items:center;gap:8px;background:rgba(26,18,12,.82);border:2px solid #b07a4a;border-radius:6px;padding:1px 12px 1px 4px;box-shadow:3px 3px 0 #000;color:#f2e2c4;animation:pkIn .15s ease-out}
#prompt .pk b{display:inline-block;min-width:22px;text-align:center;background:#fff3d0;color:#3a2418;border-radius:4px;box-shadow:inset 0 -3px 0 #e8c88a;padding:0 4px;line-height:1.1}
@keyframes pkIn{from{transform:translateY(4px);opacity:0}}
#obj .qm{display:inline-flex;align-items:baseline;gap:8px;background:rgba(20,14,10,.72);border-left:4px solid #e8c15a;border-radius:0 6px 6px 0;padding:2px 10px 2px 8px;color:#f2e2c4;box-shadow:2px 2px 0 #000;max-width:70vw}
#obj .qm i{font-style:normal;color:#e8c15a;font-size:15px;letter-spacing:1px}
#obj.qflash .qm{animation:qf 1s ease-out}@keyframes qf{0%{transform:translateX(-12px);background:rgba(232,193,90,.6)}100%{transform:none}}
.note{display:flex;align-items:center;gap:8px;background:rgba(26,18,12,.9);border:2px solid #b07a4a;border-radius:6px;box-shadow:3px 3px 0 #000;color:#f2e2c4;font-size:20px;padding:2px 12px 2px 6px;max-width:80vw;animation:noteIn .25s ease-out;transition:opacity .45s,transform .45s}
.note b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#e8c15a;color:#3a2418;font-size:16px}
.note.out{opacity:0;transform:translateY(-8px)}@keyframes noteIn{from{transform:translateY(-10px);opacity:0}}
#dlg:not(.hidden){animation:dlgIn .18s ease-out}@keyframes dlgIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#pt:not(.hidden){animation:ptIn .22s ease-out}@keyframes ptIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
#ui>div{animation:uiIn .35s ease-out}@keyframes uiIn{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
#bag:not(.hidden),#phone:not(.hidden){animation:uiIn .2s ease-out}
#ui button,#bag button,#dlg button{transition:background-color .12s,color .12s,transform .06s}#ui button:active,#bag button:active,#dlg button:active{transform:translate(2px,2px)}
#ui img{image-rendering:auto}
#paper{background:transparent no-repeat top center/100% 100%;background-attachment:local;scrollbar-width:none;image-rendering:pixelated;color:#3a2410;filter:drop-shadow(6px 6px 0 #000);font-size:26px;line-height:1.25;padding:38px 46px !important}
#phone{background:#101418;border:6px solid #2a2f36;border-radius:22px;box-shadow:6px 6px 0 #000}
</style>
</head>
<body>
<div class="fixed inset-0 flex items-center justify-center">
  <div id="screen">
    <canvas id="c"></canvas>
    <div id="where" class="sh absolute left-2 top-1 text-xl leading-none text-stone-300"></div>
    <div id="obj" class="absolute left-2 bottom-2 text-xl leading-none"></div>
    <div id="notes" class="absolute left-1/2 -translate-x-1/2 top-2 flex flex-col items-center gap-1 pointer-events-none"></div>
    <div id="prompt" class="sh hidden absolute left-0 right-0 bottom-[30%] text-center text-2xl text-amber-300"></div>
    <div id="cap" class="sh absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none opacity-0">
      <div id="capBig" class="text-6xl text-stone-100 leading-none"></div><div id="capSmall" class="text-3xl text-amber-300 leading-none mt-2"></div>
    </div>
    <div id="dlg" class="hidden absolute left-[3%] right-[3%] bottom-[3%] px-5 pt-5 pb-4">
      <div id="pt" class="hidden"><img id="ptImg" alt=""></div>
      <div id="dlgWho"></div>
      <div id="dlgTxt" class="text-3xl leading-tight min-h-[2.4em]"></div>
      <div id="dlgOpts" class="flex flex-wrap gap-2 mt-1"></div>
      <div id="dlgHint">▼</div>
    </div>
    <div id="phone" class="hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] p-4"></div>
    <div id="paper" class="hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[86%] max-h-[92%] overflow-auto p-5"></div>
    <div id="bag" class="hidden absolute inset-[6%] bg-black/90 border-4 border-amber-500 p-4 overflow-auto"></div>
  </div>
</div>
<div id="volbar" class="fixed top-1 right-1 z-20 bg-black/75 border border-stone-600 px-2 py-1 text-lg leading-none flex items-center gap-2 select-none">
  <button id="mute" class="text-xl" title="Tắt/bật tiếng (phím M)">🔊</button><span>Nhạc</span><input id="vm" type="range" min="0" max="100" class="w-16 accent-lime-400"><span>SFX</span><input id="vs" type="range" min="0" max="100" class="w-16 accent-amber-400">
</div>
<div id="ui" class="fixed inset-0 z-10 flex items-center justify-center bg-black/90 overflow-auto"></div>
<div id="pause" class="hidden fixed inset-0 z-30 flex items-center justify-center bg-black/60"></div>

<script>
(() => {
'use strict';
/* =====================================================================
   CHUYẾN ĐI THỰC TẾ — Chương 1: Khe Sanh — Phần I–II (sáng 13/6 tới đêm ở làng Tari)
   Truyện gốc của tác giả. Tên người, làng Tari, tổ chức Form0saa trong game là hư cấu.
   ===================================================================== */
const VW = 320, VH = 180, TS = 16;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
function fit() { const vv = window.visualViewport, W0 = vv ? vv.width : innerWidth, H0 = vv ? vv.height : innerHeight; let s = Math.min(W0 / VW, H0 / VH); if (s >= 2) s = Math.floor(s); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); if (window.visualViewport) visualViewport.addEventListener('resize', fit); fit();
const SP = /[?&]test/.test(location.search) ? 'cdtx_' : 'cdtt_'; // chế độ test lưu riêng, không đè save thật
const SK = k => (/^(save|ck_)/.test(k) ? SP : 'cdtt_') + k; // chỉ save tách riêng khi test; âm lượng, tắt tiếng, tên dùng chung
const store = { get(k, d) { try { const v = localStorage.getItem(SK(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(SK(k), JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(SK(k)); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function setHTML(el, h) { if (el._h !== h) { el._h = h; el.innerHTML = h; } }
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wait = s => new Promise(r => setTimeout(r, s * 1000));

/* ---------------- ÂM THANH ---------------- */
let ac = null, volM = store.get('volM', .5), volS = store.get('volS', .6), muted = store.get('mute', false), bgm = null, sfxBus = null, ambBus = null;
function outBus() { if (!ac) return null; if (!sfxBus) { sfxBus = ac.createGain(); sfxBus.connect(ac.destination); ambBus = ac.createGain(); ambBus.connect(sfxBus); } sfxBus.gain.value = muted ? 0 : volS; return sfxBus; }
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'square', v = .04, slide = 0, at = 0, dest) {
  if (!ac || muted) return; outBus(); const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(dest || sfxBus); o.start(t); o.stop(t + d + .02);
}
let nbuf = null;
function noiseBuf() { if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const ch = nbuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; } return nbuf; }
function noise(v = .15, d = .35, f0 = 1600, f1 = 90, at = 0, dest) {
  if (!ac || muted) return; outBus();
  if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const ch = nbuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(), t = ac.currentTime + at;
  s.buffer = nbuf; f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f).connect(g).connect(dest || sfxBus); s.start(t); s.stop(t + d);
}
/* ---------- HIỆU ỨNG ÂM THANH (tự tổng hợp bằng Web Audio, nhẹ và mềm kiểu game nông trại pixel) ---------- */
function nz(v, d, type, fq, q = 1, at = 0, dest) { // tiếng nhiễu qua bộ lọc cố định: bước chân, giấy, tí tách
  if (!ac || muted) return; outBus(); noiseBuf(); const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + at;
  s.buffer = nbuf; fl.type = type; fl.frequency.value = fq; fl.Q.value = q; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(dest || sfxBus); s.start(t, Math.random() * 1.5); s.stop(t + d + .02);
}
function vox(f0, f1, d, v, at = 0, formant = 800, dest) { // một âm tiết giọng người (cho tiếng rì rầm, cười, ồ, reo)
  if (!ac || muted) return; outBus(); const t = ac.currentTime + at, o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + d); fl.type = 'bandpass'; fl.frequency.value = formant; fl.Q.value = 2.5;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + d * .25); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(fl).connect(g).connect(dest || ambBus); o.start(t); o.stop(t + d + .02);
}
const lastS = {};
function gate(k, gap) { const t = performance.now() / 1000; if (t - (lastS[k] || -99) < gap) return false; lastS[k] = t; return true; } // chống phát chồng cùng một tiếng
const rnd = (a, b) => a + Math.random() * (b - a);
const SFX = {
  step(surf, run, echo) { const k = run ? 1.3 : 1, p = rnd(.9, 1.1);
    if (surf === 'grass') { nz(.05 * k, .07, 'highpass', 2600 * p); nz(.025 * k, .05, 'bandpass', 900 * p, 1.2); }
    else if (surf === 'dirt') { nz(.08 * k, .06, 'lowpass', 650 * p); nz(.018 * k, .025, 'highpass', 3200); }
    else if (surf === 'wood') { tone(170 * p, .06, 'sine', .07 * k, -60); nz(.03 * k, .03, 'bandpass', 1300 * p, 2); }
    else if (surf === 'rubber') { nz(.05 * k, .05, 'lowpass', 420 * p); }
    else { nz(.05 * k, .025, 'highpass', 2200 * p); tone(950 * p, .02, 'triangle', .012 * k); if (echo) { nz(.018 * k, .025, 'highpass', 2200 * p, 1, .11); nz(.008 * k, .025, 'highpass', 2200 * p, 1, .22); } } },
  door() { nz(.05, .3, 'bandpass', 700, 3); tone(150, .22, 'triangle', .035, -40); tone(310, .3, 'sawtooth', .006, 90, .04); },
  doorClose() { nz(.09, .1, 'lowpass', 300); tone(95, .12, 'sine', .07, -35); },
  busDoor() { nz(.06, .45, 'highpass', 2600, .7); tone(120, .2, 'sine', .04, -30, .4); },
  interact() { tone(620, .045, 'triangle', .03); tone(930, .06, 'triangle', .022, 0, .04); },
  pickup() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .09, 'square', .022, 0, i * .05)); },
  paper() { for (let i = 0; i < 4; i++) nz(.035, .06, 'bandpass', rnd(2500, 5000), 1.5, i * .045); },
  quest() { if (!gate('quest', .8)) return; tone(784, .22, 'triangle', .04); tone(1175, .26, 'triangle', .04, 0, .11); tone(1568, .4, 'sine', .02, 0, .22); },
  open() { tone(520, .07, 'triangle', .025, 160); }, next() { tone(720, .03, 'square', .01); },
  choice() { tone(880, .05, 'triangle', .02); tone(1100, .06, 'triangle', .02, 0, .05); }, select() { tone(988, .06, 'square', .018); tone(1318, .09, 'square', .018, 0, .06); },
  close() { tone(620, .08, 'triangle', .022, -220); },
  vomit() { nz(.16, .9, 'lowpass', 500, 1.5); vox(110, 70, .7, .05, .05, 400, sfxBus); nz(.08, .5, 'bandpass', 300, 3, .4); },
  alert() { tone(880, .12, 'square', .03); tone(1320, .2, 'square', .03, 0, .1); },
  caught() { noise(.3, .8, 1200, 60); tone(70, .9, 'sawtooth', .07, -30); vox(260, 520, .5, .05, 0, 900, sfxBus); },
  heart(k = 1) { tone(58, .12, 'sine', .1 * k); tone(50, .14, 'sine', .08 * k, 0, .13); },
  swish() { nz(.07, .12, 'bandpass', 2400, 1.2); tone(900, .08, 'sine', .01, -500); },
  hit() { nz(.1, .09, 'lowpass', 600); tone(140, .08, 'square', .03, -60); },
  pistol() { noise(.22, .2, 3500, 200); tone(160, .08, 'square', .05, -90); },
  rifle() { noise(.16, .1, 4000, 300); tone(120, .05, 'square', .04, -50); },
  click() { tone(1800, .02, 'square', .02); tone(1200, .02, 'square', .02, 0, .05); },

function build(w, h, fill, fn) {
  const g = Array.from({ length: h }, () => Array(w).fill(fill));
  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; };
  const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(x, y, c); };
  const box = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x === x0 || y === y0 || x === x1 || y === y1) put(x, y, c); };
  fn({ g, put, rect, box, w, h });
  return g;
}

  lab_subjects: ['Hồ sơ các đối tượng thử nghiệm', 'ĐOÀN XE 13/6 — 38 ĐỐI TƯỢNG\n\nNhóm A (phục tùng): 29\nNhóm B (phản ứng xấu — đã xử lý): 6\nNhóm C (kháng X-3 — theo dõi): 3\n  · C-1: học sinh, đến muộn, không ăn sáng cùng đoàn.\n  · C-2: hướng dẫn viên địa phương. Chưa rõ vì sao.\n  · T-07: học sinh, kháng hoàn toàn. Đã chuyển đi ngày 13/6. Nơi nhận: ████.\n\nSau xử lý: XOÁ tên đối tượng nhóm B khỏi danh sách đăng ký chuyến đi.', 'Cạnh dòng "C-1" có ai viết bút đỏ: "đứa ngủ quên".'],

    <div id="dpad"><button data-k="ArrowLeft" class="tb">←</button><button data-k="ArrowDown" class="tb">↓</button><button data-k="ArrowUp" class="tb">↑</button><button data-k="ArrowRight" class="tb">→</button></div>
    <div id="tsys"><button data-k="Tab" class="tb sm" aria-label="Túi đồ">🎒</button><button data-k="KeyB" class="tb sm map" aria-label="Bản đồ">🗺</button><button data-k="Escape" class="tb sm" aria-label="Tạm dừng">☰</button></div>`;
  document.body.appendChild(el);
  const send = (type, code) => dispatchEvent(new KeyboardEvent(type, { code, key: '' }));
  el.querySelectorAll('[data-k]').forEach(b => { const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); try { b.setPointerCapture(e.pointerId); } catch (_) {} b.classList.add('on'); send('keydown', k); });
    const up = () => { if (!b.classList.contains('on')) return; b.classList.remove('on'); send('keyup', k); }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); });
  const joy = $('joy'), knob = $('knob'); let jid = null;
  const setDir = (dx, dy) => { const r = joy.clientWidth / 2, d = Math.hypot(dx, dy), m = Math.min(d, r * .62), dead = r * .22; knob.style.transform = d ? `translate(${dx / d * m}px,${dy / d * m}px)` : '';
    const ax = Math.abs(dx), ay = Math.abs(dy); keys.KeyA = dx < -dead && ax > ay * .45; keys.KeyD = dx > dead && ax > ay * .45; keys.KeyW = dy < -dead && ay > ax * .45; keys.KeyS = dy > dead && ay > ax * .45; keys.ShiftLeft = d > r * .85; }; // đẩy ra sát mép = chạy
  const mv = e => { if (e.pointerId !== jid) return; const b = joy.getBoundingClientRect(); setDir(e.clientX - b.left - b.width / 2, e.clientY - b.top - b.height / 2); };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); jid = e.pointerId; try { joy.setPointerCapture(jid); } catch (_) {} mv(e); });
  joy.addEventListener('pointermove', mv); const end = e => { if (e.pointerId !== jid) return; jid = null; setDir(0, 0); }; joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  cv.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && dlg && !dlg.opts) { e.preventDefault(); advance(); } }); // chạm vào khung game để đọc tiếp
  document.addEventListener('gesturestart', e => e.preventDefault()); document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  let lastT = 0; document.addEventListener('touchend', e => { const now = Date.now(), tag = e.target.tagName; if (now - lastT < 350 && tag !== 'INPUT' && tag !== 'BUTTON') e.preventDefault(); lastT = now; }, { passive: false }); // chạm hai lần liền không bị phóng to
  $('prompt').addEventListener('pointerdown', e => { e.preventDefault(); send('keydown', 'KeyE'); send('keyup', 'KeyE'); }); // chạm vào khung gợi ý cũng tương tác được
  setInterval(() => { const play = G.state === 'play' && !G.paused; el.classList.toggle('hide', !play); el.classList.toggle('dance', !!G.mini); el.classList.toggle('combat', !!(S && S.combat && F.sv)); el.classList.toggle('surv', !!(S && S.surv && F.sv)); el.classList.toggle('boss', !!bossActive()); el.classList.toggle('hasmap', has('map')); if (!play && jid == null) setDir(0, 0); }, 150);
}
if (matchMedia('(pointer: coarse)').matches || /[?&]touch/.test(location.search)) setupTouch();
syncVol(); showTitle();
})();
